name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shared

      - run: pnpm build:mcp

      - run: pnpm --filter @mtg-deckbuilder/electron-app compile

      - run: pnpm typecheck

      - run: pnpm -r test
