name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable && corepack install

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shared

      - name: Create Release Pull Request or Tag
        uses: changesets/action@v2
        with:
          pr-title: "Version Packages"
          commit-message: "Version Packages"
          version-script: pnpm version-packages
          # v2 ignores the GITHUB_TOKEN env var. A PAT is needed so the
          # Version Packages PR triggers CI (GITHUB_TOKEN-created PRs don't).
          github-token: ${{ secrets.RELEASE_TOKEN }}
